name: Build debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: npm i
      - run: npm run buildFrontend:stageWeb:unminified
      - run: npm run sync:android
      - run: cd android && ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: habit-apk
          path: android/app/build/outputs/apk/fdroid/debug/*.apk
